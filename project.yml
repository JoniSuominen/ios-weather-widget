name: WeatherUV
options:
  bundleIdPrefix: com.jonisuominen.readout
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Leave DEVELOPMENT_TEAM empty; set your own Team in Xcode when you have one.
    DEVELOPMENT_TEAM: ""
    # Public HTTPS OAuth broker URL; never place an Oura client secret here.
    OURA_BROKER_URL: ""
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  WeatherUV:
    type: application
    platform: iOS
    sources:
      - path: WeatherUV
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Readout
        PRODUCT_MODULE_NAME: WeatherUV
        PRODUCT_BUNDLE_IDENTIFIER: com.jonisuominen.readout
        INFOPLIST_FILE: WeatherUV/Info.plist
        CODE_SIGN_ENTITLEMENTS: WeatherUV/WeatherUV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: WeatherUVWidget

  WeatherUVWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WeatherUVWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonisuominen.readout.widget
        INFOPLIST_FILE: WeatherUVWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: WeatherUVWidget/WeatherUVWidget.entitlements

  WeatherUVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonisuominen.readout.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Readout.app/Readout"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: WeatherUV

schemes:
  WeatherUV:
    build:
      targets:
        WeatherUV: all
        WeatherUVWidget: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - WeatherUVTests
